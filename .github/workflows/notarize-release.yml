name: Notarize Artifacts
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  notarize:
    runs-on: ubuntu-latest
    env:
      AO_TRUST_KEY: ${{ secrets.AO_TRUST_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: AOTrust Notarize
        uses: GitSerge-crypto/aotrust-skills/action@v1
        with:
          files: 'README.md'