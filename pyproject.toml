[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aotrust-mcp-server"
version = "1.0.0"
description = "AOTrust notary MCP server (stdio): free proof of existence and PDR verification for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2"]

[project.urls]
Homepage = "https://docs.aotrust.link"
Repository = "https://github.com/GitSerge-crypto/aotrust-skills"

[project.scripts]
aotrust-mcp-server = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server"]
